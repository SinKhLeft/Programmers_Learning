<!DOCTYPE html>
<html>
<head>
    <title>게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>게시판</h1>
        {% if user.is_authenticated %}
            <a href="{% url 'post_create' %}" class="btn btn-primary mb-3">새 글 작성</a>
        {% endif %}
        
        <div class="list-group">
            {% for post in posts %}
                <a href="{% url 'post_detail' pk=post.pk %}" class="list-group-item list-group-item-action">
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">{{ post.title }}</h5>
                        <small>{{ post.created_at|date:"Y-m-d H:i" }}</small>
                    </div>
                    <p class="mb-1">{{ post.content|truncatechars:100 }}</p>
                    <small>작성자: {{ post.author.username }}</small>
                </a>
            {% empty %}
                <p>게시글이 없습니다.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
