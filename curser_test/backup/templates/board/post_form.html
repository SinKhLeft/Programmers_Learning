<!DOCTYPE html>
<html>
<head>
    <title>{% if form.instance.pk %}글 수정{% else %}새 글 작성{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>{% if form.instance.pk %}글 수정{% else %}새 글 작성{% endif %}</h1>
        <form method="post" class="mt-3">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_title" class="form-label">제목</label>
                {{ form.title }}
            </div>
            <div class="mb-3">
                <label for="id_content" class="form-label">내용</label>
                {{ form.content }}
            </div>
            <button type="submit" class="btn btn-primary">저장</button>
            <a href="{% url 'post_list' %}" class="btn btn-secondary">취소</a>
        </form>
    </div>
</body>
</html>
