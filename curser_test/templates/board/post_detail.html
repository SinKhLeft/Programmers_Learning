<!DOCTYPE html>
<html>
<head>
    <title>{{ post.title }}</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>{{ post.title }}</h1>
        <div class="card">
            <div class="card-body">
                <p class="card-text">{{ post.content }}</p>
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <small class="text-muted">작성자: {{ post.author.username }}</small>
                    <small class="text-muted">작성일: {{ post.created_at|date:"Y-m-d H:i" }}</small>
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            {% if user.is_authenticated and user == post.author %}
                <a href="{% url 'post_edit' pk=post.pk %}" class="btn btn-primary">수정</a>
                <a href="{% url 'post_delete' pk=post.pk %}" class="btn btn-danger" onclick="return confirm('정말 삭제하시겠습니까?')">삭제</a>
            {% endif %}
            <a href="{% url 'post_list' %}" class="btn btn-secondary">목록으로</a>
        </div>
    </div>
</body>
</html>
