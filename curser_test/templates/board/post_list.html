<!DOCTYPE html>
<html>
<head>
    <title>게시판</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>게시판</h1>
        <a href="{% url 'post_create' %}" class="btn btn-primary mb-4">새 글 작성</a>
        
        <div class="list-group">
            {% for post in posts %}
                <a href="{% url 'post_detail' pk=post.pk %}" class="list-group-item list-group-item-action">
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">{{ post.title }}</h5>
                        <small>{{ post.created_at|date:"Y-m-d H:i" }}</small>
                    </div>
                    <p class="mb-1">{{ post.content|truncatechars:100 }}</p>
                    <small>작성자: {{ post.author.username }}</small>
                </a>
            {% empty %}
                <div class="alert alert-info">
                    게시글이 없습니다.
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
